name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.1.0 (no leading v)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RAW: ${{ inputs.version }}
        run: |
          VERSION="${RAW#v}"
          VERSION="${VERSION#V}"
          if [[ "$VERSION" != "$RAW" ]]; then
            echo "::notice::Stripped leading v from input — using $VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 2.1.0 (got '$RAW')"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Guard against an already-existing tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            echo "::error::Tag $TAG already exists on origin. Pick a version that hasn't been released yet."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run tests
        run: npm test

      - name: Configure git identity
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version

      - name: Commit and tag release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$TAG"

      - name: Build renderer
        run: npm run build:renderer

      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
